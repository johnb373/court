<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F2E24" />
<title>Court Rotation</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Court Rotation" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html,body{margin:0;height:100%;background:#0F2E24;color:#9FBDAE;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #boot{display:flex;height:100%;align-items:center;justify-content:center;
    text-align:center;padding:24px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Loading&hellip;</div>
<script>
(function () {
  // Keep a copy on the phone so the app opens with no signal.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  var s = document.createElement('script');
  s.src = 'appbundle.js';
  s.onerror = function () {
    document.getElementById('boot').innerHTML =
      'Could not load the app.<br/><br/>' +
      'Open it once with a connection and it will work offline afterwards.';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
