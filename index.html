<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F2E24" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Court Rotation</title>
<link rel="manifest" href="manifest.json?m=1" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Court Rotation" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html,body{margin:0;height:100%;background:#0F2E24;color:#9FBDAE;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #boot{display:flex;height:100%;align-items:center;justify-content:center;
    text-align:center;padding:24px;font-size:14px;line-height:1.5}
  #boot b{color:#D6E62B}
</style>
</head>
<body>
<div id="boot">Loading&hellip;<br/><b>shell s4</b></div>
<script>
// Shell s4. Never contains app logic — it only fetches the current code,
// so an installed app can't get stuck on an old version.
(function(){
  var tried = [];
  var names = ['appbundle.js', 'app.bundle.js'];
  function load(i){
    if (i >= names.length) {
      document.getElementById('boot').innerHTML =
        'Could not load the app.<br/><br/>Tried:<br/><b>' + tried.join('<br/>') +
        '</b><br/><br/>Check those files exist in the same folder, then restart Home Assistant.';
      return;
    }
    var url = names[i] + '?t=' + Date.now();
    tried.push(names[i]);
    var s = document.createElement('script');
    s.src = url;
    s.onerror = function(){ load(i+1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
</body>
</html>
